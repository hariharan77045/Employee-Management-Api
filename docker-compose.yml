# Runs the whole app locally in Docker: PostgreSQL + Spring Boot + Angular (nginx).
#
#   1. Create a .env file next to this one (git-ignored), for example:
#        DB_PASSWORD=choose-a-db-password
#        JWT_SECRET=at-least-32-random-characters-here
#   2. docker compose up --build
#   3. Open http://localhost:8081
#
# The frontend is built from the Employee-Management repo, expected at FRONTEND_DIR
# (by default the folder layout used on this machine).

name: employeehub

services:
  db:
    build: ./db
    image: employeehub-db:local
    environment:
      POSTGRES_DB: employee_management_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_management_project"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    image: employeehub-backend:local
    environment:
      DB_URL: jdbc:postgresql://db:5432/employee_management_project
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ${FRONTEND_DIR:-../../../employeeManagement}
    image: employeehub-frontend:local
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db-data:

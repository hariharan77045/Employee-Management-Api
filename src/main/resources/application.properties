spring.application.name=employee-management

# Hosting platforms such as Render pass the port to listen on in PORT.
server.port=${PORT:8080}
# Trust X-Forwarded-* headers from the platform's proxy / Kubernetes ingress.
server.forward-headers-strategy=framework

# Only the health endpoint is exposed; Docker, Kubernetes and Render use it for checks.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Secrets are NOT stored in this file. Provide them either as environment variables
# (DB_PASSWORD, JWT_SECRET) or in src/main/resources/application-local.properties,
# which is git-ignored and loaded automatically when present.
# See application-local.properties.example for the template.
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL Database Configuration
# Override any of these with environment variables (DB_URL, DB_USERNAME, DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_management_project}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
# The tables already exist (and hold seed data), so Hibernate must not change them.
# schema.sql below only adds ID sequences and the announcement/company_event tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Runs schema.sql then data.sql (one-off mock data) on every start; both are safe to repeat.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# --- Security ---------------------------------------------------------------------
# HS256 signing key for login tokens (at least 32 characters, random). The app refuses to start
# without one. Changing it signs everyone out.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-minutes=480

# Accounts lock for lock-minutes after this many wrong passwords in a row.
app.security.max-failed-attempts=5
app.security.lock-minutes=15

# Password given to seeded accounts and to employees HR adds. Practice data only.
app.security.default-password=${DEFAULT_PASSWORD:Password@123}

# Frontend origins allowed to call the API directly (the Angular dev proxy doesn't need this).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
